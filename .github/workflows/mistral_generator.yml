name: Generate Rewrite Proposal with Mistral

on:
  issues:
    types: [labeled]

jobs:
  generate_proposal:
    if: github.event.label.name == 'needs-mistral'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for existing manual proposal
        id: check_manual
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const manualProposal = comments.find(c =>
              c.body && c.body.includes('### Proposition de réécriture :')
            );

            if (manualProposal) {
              console.log('Manual proposal already exists, skipping Mistral');
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Generate proposal with Mistral
        if: steps.check_manual.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const prompt = "Génère une proposition de réécriture pour cette issue au format suivant :\n\n" +
              "### Proposition de réécriture :\n" +
              "**Titre amélioré :** [Nouveau titre]\n\n" +
              "**Description améliorée :**\n" +
              "---\n" +
              "[Description structurée]\n" +
              "---\n\n" +
              "**Règles :**\n" +
              "- Réponds UNIQUEMENT avec le bloc ci-dessus.\n" +
              "- Utilise des sections claires (Contexte, Objectif, Critères d'acceptation).";

            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
              },
              body: JSON.stringify({
                model: 'mistral-small-latest',
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3,
                max_tokens: 1000
              })
            });

            if (mistralResponse.ok) {
              const data = await mistralResponse.json();
              const content = data.choices[0].message.content;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content
              });
            }

      - name: Remove needs-mistral label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'needs-mistral'
            });
