name: PO Agent (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt pour l'agent PO"
        required: false
        default: "Generate a priority improvement issue for my-utils-for-versel"

jobs:
  run_po_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Mistral PO Agent
        uses: actions/github-script@v7
        env:
          MISTRAL_API_ID_PO: ${{ secrets.MISTRAL_API_ID_PO }}
        with:
          script: |
            const prompt = `${{ github.event.inputs.prompt }}`;
            const bearerPrefix = String.fromCharCode(66, 101, 97, 114, 101, 114, 32);
            const authHeader = bearerPrefix + process.env.MISTRAL_API_ID_PO;
            
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': authHeader
              },
              body: JSON.stringify({
                model: process.env.MISTRAL_API_ID_PO,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3
              })
            });

            if (!mistralResponse.ok) {
              const errorDetails = await mistralResponse.text();
              core.setFailed('Mistral API error: ' + mistralResponse.status + ' - ' + errorDetails);
              return;
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            core.info('Mistral response: ' + content);
            
            try {
              const issueData = JSON.parse(content);
              if (issueData.title && issueData.body) {
                const labels = issueData.labels || ['enhancement', 'needs-mistral'];
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueData.title,
                  body: issueData.body,
                  labels: labels
                });
                core.info('Issue created successfully!');
              } else {
                core.warning('Valid response but incomplete JSON format.');
              }
            } catch (e) {
              core.warning('Invalid JSON format in response.');
            }
