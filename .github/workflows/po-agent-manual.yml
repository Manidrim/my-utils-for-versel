name: PO Agent (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt pour l'agent PO (optionnel)"
        required: false
        default: "Génère une issue d'amélioration prioritaire pour my-utils-for-versel au format JSON strict : {\"title\": \"...\", \"body\": \"...\", \"labels\": [\"enhancement\", \"needs-mistral\"]}"

jobs:
  run_po_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Appel API Mistral (PO)
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_ID_PO }}
        with:
          script: |
            const prompt = `${{ github.event.inputs.prompt }}`;
            
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.MISTRAL_API_KEY}`
              },
              body: JSON.stringify({
                model: process.env.MISTRAL_API_ID_PO,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3
              })
            });

            if (!mistralResponse.ok) {
              throw new Error(`Mistral API error: ${mistralResponse.statusText}`);
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            
            // Essayer de parser le JSON pour créer une issue
            try {
              const issueData = JSON.parse(content);
              if (issueData.title && issueData.body) {
                const labels = issueData.labels || ['enhancement', 'needs-mistral'];
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueData.title,
                  body: issueData.body,
                  labels: labels
                });
                
                core.info('✅ Issue créée avec succès !');
              } else {
                core.setOutput('response', content);
                core.warning('⚠️ Réponse valide mais format JSON incomplet. Affichage dans les logs.');
              }
            } catch (e) {
              core.setOutput('response', content);
              core.warning('⚠️ Réponse non valide au format JSON. Affichage dans les logs.');
            }
