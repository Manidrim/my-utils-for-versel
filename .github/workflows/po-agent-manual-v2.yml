name: PO Agent Manual v2

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to analyze (format: owner/repo)"
        required: true
        default: "Manidrim/my-utils-for-versel"

jobs:
  analyze_and_create_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read PO_BRIEF.md
        id: read_brief
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const briefPath = path.join(process.env.GITHUB_WORKSPACE, 'PO_BRIEF.md');
            let briefContent = '';
            try {
              briefContent = fs.readFileSync(briefPath, 'utf8');
            } catch (e) {
              core.warning('PO_BRIEF.md not found, continuing without it.');
            }
            core.setOutput('content', briefContent);

      - name: Call Mistral PO Agent v2
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const repository = `${{ github.event.inputs.repository }}`;
            const briefContent = `${{ steps.read_brief.outputs.content }}`;
            const authHeader = 'Bearer ' + process.env.MISTRAL_API_KEY;
            
            const poPrompt = [
              "Tu es un Product Owner senior ultra-rigoureux, specialise dans l optimisation de projets logiciels.",
              "Ta mission : Analyser le projet fourni et identifier UNE SEULE issue d amelioration, la plus critique et impactante pour la qualite, la maintenabilite ou l experience utilisateur.",
              "",
              "Contexte supplementaire :",
              "Voici le brief du projet pour t aider dans ton analyse :",
              briefContent,
              "",
              "Regles absolues :",
              "1. Une seule issue : Memes si tu vois 10 problemes, choisis LE PLUS IMPORTANT selon ces criteres (par ordre) :",
              "   - Impact utilisateur final (bugs, UX, performance).",
              "   - Risque technique (dette technique, securite, scalabilite).",
              "   - Effort de correction (privilégie les quick wins si impact equivalent).",
              "2. Sois specifique : L issue doit etre actionnable (pas de ameliorer la doc, mais ajouter des exemples dans la doc de l API /users).",
              "3. Format de sortie : UNIQUEMENT ce JSON (pas de texte avant/apres) :",
              "   title: string (max 50 caracteres)",
              "   body: string avec Contexte, Impact, Solution proposee, Criteres d acceptation",
              "   priority: low|medium|high|critical",
              "   labels: array de max 3 strings"
            ].join("\n");

            const userPrompt = `Analyse le projet GitHub suivant : ${repository}. ${poPrompt}`;
            
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': authHeader
              },
              body: JSON.stringify({
                model: "mistral-large-latest",
                messages: [{ role: 'user', content: userPrompt }],
                temperature: 0.3
              })
            });

            if (!mistralResponse.ok) {
              const errorDetails = await mistralResponse.text();
              core.setFailed(`Mistral API error: ${mistralResponse.status} - ${errorDetails}. Vérifiez que MISTRAL_API_KEY est configuré.`);
              return;
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            core.info('Mistral response: ' + content);
            
            try {
              const issueData = JSON.parse(content);
              if (issueData.title && issueData.body) {
                const labels = issueData.labels || ['enhancement', 'needs-mistral'];
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueData.title,
                  body: issueData.body,
                  labels: labels
                });
                core.info('Issue created successfully!');
              } else {
                core.warning('Valid response but incomplete JSON format.');
              }
            } catch (e) {
              core.warning('Invalid JSON format in response: ' + e.message);
            }
