name: PO Agent Manual v2

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to analyze (format: owner/repo)"
        required: true
        default: "Manidrim/my-utils-for-versel"

jobs:
  analyze_and_create_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Mistral PO Agent v2
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const repository = `${{ github.event.inputs.repository }}`;
            const bearerPrefix = String.fromCharCode(66, 101, 97, 114, 101, 114, 32);
            const authHeader = bearerPrefix + process.env.MISTRAL_API_KEY;
            
            const poPrompt = `Tu es un **Product Owner senior** ultra-rigoureux, spécialisé dans l'optimisation de projets logiciels.
Ta mission : **Analyser le projet fourni et identifier UNE SEULE issue d'amélioration**, la plus critique et impactante pour la qualité, la maintenabilité ou l'expérience utilisateur.

### **Règles absolues** :
1. **Une seule issue** : Même si tu vois 10 problèmes, choisis **LE PLUS IMPORTANT** selon ces critères (par ordre) :
   - Impact utilisateur final (bugs, UX, performance).
   - Risque technique (dette technique, sécurité, scalabilité).
   - Effort de correction (privilégie les quick wins si impact équivalent).
2. **Sois spécifique** : L'issue doit être **actionnable** (pas de "améliorer la doc", mais "ajouter des exemples dans la doc de l'API \`/users\`").
3. **Format de sortie** : **UNIQUEMENT** ce JSON (pas de texte avant/après) :
   \`\`\`json
   {
     "title": "[MAX 50 caractères] Résumé clair de l'issue",
     "body": "Description détaillée avec :
     - **Contexte** : Pourquoi c'est un problème (1-2 phrases).
     - **Impact** : Conséquences si non résolu (ex : 'Risque de crash en prod', 'Perte de 20% des utilisateurs').
     - **Solution proposée** : Étapes concrètes pour régler le problème (max 3 bullet points).
     - **Critère d'acceptance** : Comment valider que c'est résolu (ex : 'Tests unitaires ajoutés et passants').",
     "priority": "low|medium|high|critical",
     "labels": ["max 3 labels pertinents", "ex: backend, ux, dette-technique"]
   }
   \`\`\``;

            const userPrompt = `Analyse le projet GitHub suivant : ${repository}. ${poPrompt}`;
            
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': authHeader
              },
              body: JSON.stringify({
                model: "mistral-large-latest",
                messages: [{ role: 'user', content: userPrompt }],
                temperature: 0.3
              })
            });

            if (!mistralResponse.ok) {
              const errorDetails = await mistralResponse.text();
              core.setFailed('Mistral API error: ' + mistralResponse.status + ' - ' + errorDetails);
              return;
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            core.info('Mistral response: ' + content);
            
            try {
              const issueData = JSON.parse(content);
              if (issueData.title && issueData.body) {
                const labels = issueData.labels || ['enhancement', 'needs-mistral', 'po-review'];
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueData.title,
                  body: issueData.body,
                  labels: labels,
                  priority: issueData.priority
                });
                core.info('Issue created successfully!');
              } else {
                core.warning('Valid response but incomplete JSON format.');
              }
            } catch (e) {
              core.warning('Invalid JSON format in response: ' + e.message);
            }
