name: Reusable - Handle Clarification OK Label

on:
  workflow_call:
    inputs:
      clarification_ok_label:
        required: false
        type: string
        default: clarification-ok
      development_label:
        required: false
        type: string
        default: development
      po_label:
        required: false
        type: string
        default: po-generated
      mistral_model:
        required: false
        type: string
        default: mistral-small-latest
    secrets:
      MISTRAL_API_KEY:
        required: false

jobs:
  update_issue_from_comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Find and process latest comment with rewrite proposal
        id: process_comment
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ inputs.mistral_model }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const rewriteComments = comments.filter(c =>
              c.body && c.body.includes('Proposition de réécriture')
            );

            let newTitle = '';
            let newDescription = '';

            function extract(body) {
              let t = '', d = '';
              const titleLabelIndex = body.indexOf('**Titre amélioré :**');
              if (titleLabelIndex !== -1) {
                const afterTitleLabel = body.slice(titleLabelIndex + '**Titre amélioré :**'.length).trim();
                const titleEndIndex = afterTitleLabel.indexOf('\n');
                if (titleEndIndex !== -1) {
                  t = afterTitleLabel.slice(0, titleEndIndex).trim().replace(/^\*|\*$/g, '').trim();
                }
              }
              const descLabelIndex = body.indexOf('**Description améliorée :**');
              if (descLabelIndex !== -1) {
                const afterDescLabel = body.slice(descLabelIndex + '**Description améliorée :**'.length).trim();
                const descStartIndex = afterDescLabel.indexOf('---\n');
                if (descStartIndex !== -1) {
                  const afterFirstDash = afterDescLabel.slice(descStartIndex + '---\n'.length);
                  const descEndIndex = afterFirstDash.indexOf('\n---');
                  if (descEndIndex !== -1) {
                    d = afterFirstDash.slice(0, descEndIndex).trim();
                  }
                }
              }
              return { t, d };
            }

            if (rewriteComments.length > 0) {
              const latestComment = rewriteComments.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              )[0];
              const r = extract(latestComment.body);
              newTitle = r.t;
              newDescription = r.d;
            }

            if ((!newTitle || !newDescription) && process.env.MISTRAL_API_KEY) {
              const title = issue.title || '';
              const description = issue.body || '';
              const prompt = "Tu es un assistant technique. Analyse cette issue et propose une réécriture au format suivant :\n\n" +
                "**Issue actuelle :**\n" +
                "- Titre: " + title + "\n" +
                "- Description: " + description + "\n\n" +
                "**Format attendu (en français) :**\n" +
                "### Proposition de réécriture :\n" +
                "**Titre amélioré :** [nouveau titre clair et concis]\n\n" +
                "**Description améliorée :**\n" +
                "---\n" +
                "[Description structurée avec :\n" +
                "- Contexte\n" +
                "- Objectif\n" +
                "- Critères d'acceptation\n" +
                "- Notes techniques (si applicable)]\n" +
                "---\n\n" +
                "**Règles :**\n" +
                "- Sois concis et technique\n" +
                "- Utilise des sections claires (### ou **)\n" +
                "- Conserve les informations importantes de l'original\n" +
                "- Réponds UNIQUEMENT avec le bloc ci-dessus, sans autre texte.";
              try {
                const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
                  },
                  body: JSON.stringify({
                    model: process.env.MISTRAL_MODEL,
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.3,
                    max_tokens: 1000
                  })
                });
                if (mistralResponse.ok) {
                  const data = await mistralResponse.json();
                  const r = extract(data.choices[0].message.content);
                  if (r.t) newTitle = r.t;
                  if (r.d) newDescription = r.d;
                }
              } catch (error) {
                console.error('Mistral API error:', error);
              }
            }

            if (newTitle) {
              core.setOutput('new_title', Buffer.from(newTitle.replace(/\r/g, '').trim()).toString('base64'));
            }
            if (newDescription) {
              core.setOutput('new_description', Buffer.from(newDescription.replace(/\r/g, '')).toString('base64'));
            }

      - name: Update issue with extracted content
        if: steps.process_comment.outputs.new_title != '' || steps.process_comment.outputs.new_description != ''
        uses: actions/github-script@v7
        env:
          NEW_TITLE_B64: ${{ steps.process_comment.outputs.new_title }}
          NEW_DESC_B64: ${{ steps.process_comment.outputs.new_description }}
          CLARIFICATION_OK_LABEL: ${{ inputs.clarification_ok_label }}
          DEVELOPMENT_LABEL: ${{ inputs.development_label }}
          PO_LABEL: ${{ inputs.po_label }}
        with:
          script: |
            const newTitle = process.env.NEW_TITLE_B64 ? Buffer.from(process.env.NEW_TITLE_B64, 'base64').toString('utf8').trim() : '';
            const newDescription = process.env.NEW_DESC_B64 ? Buffer.from(process.env.NEW_DESC_B64, 'base64').toString('utf8') : '';
            const clarificationOk = process.env.CLARIFICATION_OK_LABEL;
            const developmentLabel = process.env.DEVELOPMENT_LABEL;
            const poLabel = process.env.PO_LABEL;

            const updatePayload = {};
            if (newTitle && newTitle !== '**') updatePayload.title = newTitle;
            if (newDescription && newDescription !== '**') updatePayload.body = newDescription;

            if (Object.keys(updatePayload).length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                ...updatePayload
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Issue mise à jour avec la proposition de réécriture. Merci !'
              });
            }

            for (const name of [clarificationOk, poLabel]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name
                });
              } catch (e) {
                console.log('Could not remove label ' + name + ':', e.message);
              }
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [developmentLabel]
              });
            } catch (e) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: developmentLabel,
                  color: '0075ca',
                  description: 'Issue prête pour le développement'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [developmentLabel]
                });
              } catch (e2) {
                console.log('Could not create or add development label:', e2.message);
              }
            }
