name: Reusable - PO Rewrite Generator

on:
  workflow_call:
    inputs:
      needs_mistral_label:
        required: false
        type: string
        default: needs-mistral
      mistral_model:
        required: false
        type: string
        default: mistral-small-latest
      proposal_marker:
        required: false
        type: string
        default: "### Proposition de réécriture :"
    secrets:
      MISTRAL_API_KEY:
        required: true

jobs:
  generate_proposal:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for existing manual proposal
        id: check_manual
        uses: actions/github-script@v7
        env:
          PROPOSAL_MARKER: ${{ inputs.proposal_marker }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const manualProposal = comments.find(c =>
              c.body && c.body.includes(process.env.PROPOSAL_MARKER)
            );
            core.setOutput('skip', manualProposal ? 'true' : 'false');

      - name: Generate proposal with Mistral
        if: steps.check_manual.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ inputs.mistral_model }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const prompt = "Génère une proposition de réécriture pour cette issue au format suivant :\n\n" +
              "### Proposition de réécriture :\n" +
              "**Titre amélioré :** [Nouveau titre]\n\n" +
              "**Description améliorée :**\n" +
              "---\n" +
              "[Description structurée]\n" +
              "---\n\n" +
              "**Règles :**\n" +
              "- Réponds UNIQUEMENT avec le bloc ci-dessus.\n" +
              "- Utilise des sections claires (Contexte, Objectif, Critères d'acceptation).";

            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
              },
              body: JSON.stringify({
                model: process.env.MISTRAL_MODEL,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3,
                max_tokens: 1000
              })
            });

            if (mistralResponse.ok) {
              const data = await mistralResponse.json();
              const content = data.choices[0].message.content;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content
              });
            }

      - name: Remove needs-mistral label
        uses: actions/github-script@v7
        env:
          NEEDS_MISTRAL_LABEL: ${{ inputs.needs_mistral_label }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: process.env.NEEDS_MISTRAL_LABEL
              });
            } catch (e) {
              console.log('Could not remove label:', e.message);
            }
