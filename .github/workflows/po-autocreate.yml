name: PO - Autocreate Issues

# Lancement initial manuel, puis re-déclenché à chaque fermeture d'issue
# (action humaine -> l'événement passe bien avec le GITHUB_TOKEN par défaut).
# Un seul run complète jusqu'à `max_open` issues ouvertes portant le label PO.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Dépôt à analyser (format: owner/repo)"
        required: false
        default: ""
      max_open:
        description: "Nombre max d'issues PO ouvertes simultanément"
        required: false
        default: "2"
  issues:
    types: [closed]

jobs:
  autocreate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    concurrency:
      group: po-autocreate-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create / top-up PO issues
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-large-latest
          PO_REPOSITORY: ${{ github.event.inputs.repository || github.repository }}
          BRIEF_PATH: PO_BRIEF.md
          PO_LABEL: po-generated
          MAX_OPEN: ${{ github.event.inputs.max_open || '2' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const poLabel = process.env.PO_LABEL;
            const maxOpen = parseInt(process.env.MAX_OPEN, 10) || 2;

            if (!process.env.MISTRAL_API_KEY) {
              core.setFailed('MISTRAL_API_KEY manquant : configurez le secret dans Settings > Secrets and variables > Actions.');
              return;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name
                });
              } catch (e) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name, color, description
                  });
                } catch (e2) {
                  core.info('ensureLabel ' + name + ': ' + e2.message);
                }
              }
            }
            await ensureLabel(poLabel, '5319e7', 'Issue générée par le PO Agent, en attente de validation');

            let briefContent = '';
            try {
              briefContent = fs.readFileSync(
                path.join(process.env.GITHUB_WORKSPACE, process.env.BRIEF_PATH), 'utf8');
            } catch (e) {
              core.warning(process.env.BRIEF_PATH + ' introuvable, on continue sans.');
            }
            const buildPrompt = require(
              path.join(process.env.GITHUB_WORKSPACE, '.github/prompts/autocreate.js'));

            async function countOpenPo() {
              const list = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: poLabel, per_page: 100
              });
              return list.filter(i => !i.pull_request).length;
            }

            let created = 0;
            // Boucle : un seul run remplit jusqu'à maxOpen.
            for (let guard = 0; guard < maxOpen + 1; guard++) {
              const open = await countOpenPo();
              core.info(`Issues '${poLabel}' ouvertes : ${open} / max ${maxOpen}`);
              if (open >= maxOpen) break;

              const allOpen = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100
              });
              const existingIssuesBlock = allOpen
                .filter(i => !i.pull_request)
                .map(i => `- #${i.number} ${i.title}\n  ${(i.body || '').replace(/\s+/g, ' ').slice(0, 300)}`)
                .join('\n');

              const userPrompt = buildPrompt(
                process.env.PO_REPOSITORY, briefContent, existingIssuesBlock);

              const resp = await fetch('https://api.mistral.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
                },
                body: JSON.stringify({
                  model: process.env.MISTRAL_MODEL,
                  messages: [
                    { role: 'system', content: 'You MUST respond with a valid JSON object only. No markdown, no explanation, no backticks. Use this exact format: { "title": string, "body": string, "priority": "low|medium|high|critical", "labels": string[] }' },
                    { role: 'user', content: userPrompt }
                  ],
                  temperature: 0.3,
                  response_format: { type: 'json_object' }
                })
              });

              if (!resp.ok) {
                const err = await resp.text();
                core.setFailed(`Erreur API Mistral : ${resp.status} - ${err}`);
                return;
              }
              const data = await resp.json();
              const content = data.choices[0].message.content;
              core.info('Réponse Mistral : ' + content);

              let issueData;
              try {
                issueData = JSON.parse(content);
              } catch (e) {
                core.setFailed('JSON Mistral invalide : ' + e.message + ' / ' + content);
                return;
              }
              if (!issueData.title || !issueData.body) {
                core.setFailed('Réponse Mistral incomplète (title/body) : ' + content);
                return;
              }

              const labels = Array.from(new Set([
                ...(Array.isArray(issueData.labels) ? issueData.labels : ['enhancement']),
                poLabel
              ]));
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: issueData.title, body: issueData.body, labels
              });
              created++;
              core.info('Issue créée avec le label ' + poLabel + '.');
            }
            core.info(`Terminé. ${created} issue(s) créée(s).`);
