name: Create Required Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'

jobs:
  create_labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create missing labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'enhancement', color: 'a2eeef', description: 'Amélioration ou nouvelle fonctionnalité' },
              { name: 'needs-mistral', color: '84b6eb', description: 'Proposition de réécriture à générer avec Mistral' },
              { name: 'po-review', color: 'd4c5f9', description: 'Issue nécessitant une revue PO' },
              { name: 'needs-clarification', color: 'fbc900', description: 'Cette issue a besoin de clarifications' },
              { name: 'development', color: '0075ca', description: 'Issue prête pour le développement' },
              { name: 'clarification-ok', color: '28a745', description: 'Clarifications validées' },
              { name: 'question', color: 'd73a49', description: 'Issue de type question' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Created label: ${label.name}`);
              } catch (error) {
                if (error.message.includes('already_exists')) {
                  console.log(`Label ${label.name} already exists`);
                } else {
                  console.error(`Error creating label ${label.name}:`, error.message);
                }
              }
            }
