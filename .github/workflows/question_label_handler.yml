name: Handle Question Label

on:
  issues:
    types: [labeled]

jobs:
  check_and_ask:
    if: github.event.label.name == 'question'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Mistral API to generate clarification questions
        id: mistral
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const title = issue.title || '';
            const description = issue.body || '';

            // Prepare the prompt for Mistral
            const prompt = `
            Tu es un assistant technique qui aide à clarifier les issues GitHub.
            
            **Contexte de l'issue :**
            - Titre: ${title}
            - Description: ${description}
            
            **Ta tâche :**
            Analyse cette issue et propose **3 à 5 questions pertinentes** en français pour :
            1. Clarifier le périmètre (qu'est-ce qui est inclus/exclu ?)
            2. Définir les critères d'acceptation (quand l'issue sera-t-elle résolue ?)
            3. Identifier les dépendances ou contraintes techniques
            4. Préciser les attentes fonctionnelles
            
            **Format attendu :**
            - Utilise des puces (-) pour chaque question.
            - Sois concis mais précis.
            - Adapte les questions au contexte de l'issue.
            - Si la description est vide, demande une description détaillée.
            
            **Exemple de sortie :**
            - Quel est le comportement attendu pour cette fonctionnalité ?
            - Quels sont les cas d'usage principaux à couvrir ?
            - Y a-t-il des contraintes techniques à respecter ?
            `;

            // Call Mistral API
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.MISTRAL_API_KEY}`
              },
              body: JSON.stringify({
                model: 'mistral-small-latest',
                messages: [
                  {
                    role: 'user',
                    content: prompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 500
              })
            });

            if (!mistralResponse.ok) {
              const error = await mistralResponse.text();
              console.error('Mistral API error:', error);
              // Fallback to default questions if Mistral fails
              const defaultQuestions = [
                "- **Description manquante** : Pouvez-vous décrire en détail le problème ou la fonctionnalité souhaitée ?",
                "- **Critères d'acceptation** : Quels sont les critères pour considérer cette issue comme résolue ?",
                "- **Périmètre** : Cette issue concerne-t-elle un composant spécifique, une page, ou une fonctionnalité globale ?",
                "- **Priorité** : Quelle est la priorité de cette issue (ex: haute, moyenne, basse) ?",
                "- **Contexte** : Y a-t-il un contexte particulier ou des dépendances à prendre en compte ?"
              ];
              core.setOutput('questions', defaultQuestions.join('\n'));
              return;
            }

            const data = await mistralResponse.json();
            const questions = data.choices[0].message.content;
            core.setOutput('questions', questions);

      - name: Post Mistral-generated questions as comment
        uses: actions/github-script@v7
        with:
          script: |
            const questions = `${{ steps.mistral.outputs.questions }}`;
            
            const commentBody = `
            🤔 **Clarification nécessaire pour cette question**

            Merci d'avoir ouvert cette issue ! Pour mieux comprendre le périmètre et vous aider efficacement, voici quelques questions générées par Mistral AI :

            ${questions}

            ---
            *Ce commentaire a été ajouté automatiquement car le label \`question\` a été appliqué. Les questions ont été générées par [Mistral Small](https://mistral.ai/).*
            `;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // Add needs-clarification label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-clarification']
              });
            } catch (error) {
              // Label might already exist, try to create it first
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-clarification',
                  color: 'fbc900',
                  description: 'Cette issue a besoin de clarifications'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['needs-clarification']
                });
              } catch (e) {
                console.log('Could not create or add label:', e.message);
              }
            }

            // Remove the 'question' label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'question'
              });
            } catch (e) {
              console.log('Could not remove question label:', e.message);
            }
