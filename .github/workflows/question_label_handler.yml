name: Handle Question Label

on:
  issues:
    types: [labeled]

jobs:
  check_and_ask:
    if: github.event.label.name == 'question'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Mistral API to generate clarification questions and rewrite proposal
        id: mistral
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const title = issue.title || '';
            const description = issue.body || '';

            // Prepare the prompt for Mistral
            const prompt = `
            Tu es un assistant technique qui aide à clarifier et améliorer les issues GitHub.
            
            **Contexte de l'issue :**
            - Titre: ${title}
            - Description: ${description}
            
            **Ta tâche :**
            
            **1. Questions de clarification (3-5 questions)**
            Analyse cette issue et propose **3 à 5 questions pertinentes** en français pour :
            - Clarifier le périmètre (qu'est-ce qui est inclus/exclu ?)
            - Définir les critères d'acceptation
            - Identifier les dépendances ou contraintes techniques
            - Préciser les attentes fonctionnelles
            
            **2. Proposition de réécriture**
            Propose une **version améliorée** de l'issue avec :
            - Un titre plus clair et descriptif
            - Une description structurée (contexte, objectif, critères d'acceptation, notes techniques)
            - Les éléments manquants que tu as identifiés
            
            **Format attendu :**
            
            ---
            ### 🔍 Questions pour clarifier :
            - [Question 1]
            - [Question 2]
            - [Question 3]
            
            ### ✍️ Proposition de réécriture :
            **Titre amélioré :** [Nouveau titre]
            
            **Description améliorée :**
            [Nouvelle description structurée avec sections claires]
            
            **Éléments ajoutés pour une meilleure compréhension :**
            - [Élément 1]
            - [Élément 2]
            
            **Raison des modifications :**
            [Explication brève de pourquoi ces changements améliorent la clarté]
            
            **Règles :**
            - Réponds en français.
            - Sois concis mais complet.
            - Adapte le contenu au contexte technique de l'issue.
            - Si la description est vide, propose une structure de base.
            `;

            // Call Mistral API
            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.MISTRAL_API_KEY}`
              },
              body: JSON.stringify({
                model: 'mistral-small-latest',
                messages: [
                  {
                    role: 'user',
                    content: prompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 1000
              })
            });

            if (!mistralResponse.ok) {
              const error = await mistralResponse.text();
              console.error('Mistral API error:', error);
              // Fallback to default content if Mistral fails
              const defaultContent = `
              ### 🔍 Questions pour clarifier :
              - **Description manquante** : Pouvez-vous décrire en détail le problème ou la fonctionnalité souhaitée ?
              - **Critères d'acceptation** : Quels sont les critères pour considérer cette issue comme résolue ?
              - **Périmètre** : Cette issue concerne-t-elle un composant spécifique, une page, ou une fonctionnalité globale ?
              - **Priorité** : Quelle est la priorité de cette issue (ex: haute, moyenne, basse) ?
              - **Contexte** : Y a-t-il un contexte particulier ou des dépendances à prendre en compte ?
              
              ### ✍️ Proposition de réécriture :
              **Titre amélioré :** ${title || 'Titre à définir'}
              
              **Description améliorée :**
              ${description || 'Description à ajouter'}
              
              **Éléments ajoutés pour une meilleure compréhension :**
              - Un titre plus descriptif
              - Une description détaillée
              - Des critères d'acceptation clairs
              - Le périmètre et les dépendances
              
              **Raison des modifications :**
              L'issue actuelle manque de détails pour une compréhension optimale.
              `;
              core.setOutput('content', defaultContent);
              return;
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            core.setOutput('content', content);

      - name: Post Mistral-generated content as comment
        uses: actions/github-script@v7
        with:
          script: |
            const content = `${{ steps.mistral.outputs.content }}`;
            
            const commentBody = `
            🤔 **Clarification nécessaire pour cette question**

            Merci d'avoir ouvert cette issue ! Voici une analyse et des suggestions générées par Mistral AI pour améliorer la clarté :

            ${content}

            ---
            *Ce commentaire a été ajouté automatiquement car le label \`question\` a été appliqué. Les questions et suggestions ont été générées par [Mistral Small](https://mistral.ai/).*
            `;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // Add needs-clarification label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-clarification']
              });
            } catch (error) {
              // Label might already exist, try to create it first
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-clarification',
                  color: 'fbc900',
                  description: 'Cette issue a besoin de clarifications'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['needs-clarification']
                });
              } catch (e) {
                console.log('Could not create or add label:', e.message);
              }
            }

            // Remove the 'question' label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'question'
              });
            } catch (e) {
              console.log('Could not remove question label:', e.message);
            }
