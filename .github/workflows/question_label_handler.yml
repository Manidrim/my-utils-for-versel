name: Handle Question Label

on:
  issues:
    types: [labeled]

jobs:
  check_and_ask:
    if: github.event.label.name == 'question'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Mistral API to generate clarification questions and rewrite proposal
        id: mistral
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const title = issue.title || '';
            const description = issue.body || '';

            const prompt = `Tu es un assistant technique qui aide à clarifier et améliorer les issues GitHub.` +
              `\n\n**Contexte de l'issue :**` +
              `\n- Titre: ${title}` +
              `\n- Description: ${description}` +
              `\n\n**Ta tâche :**` +
              `\n\n1. Questions de clarification (3-5 questions)` +
              `\nAnalyse cette issue et propose 3 à 5 questions pertinentes en français pour :` +
              `\n- Clarifier le périmètre (qu'est-ce qui est inclus/exclu ?)` +
              `\n- Définir les critères d'acceptation` +
              `\n- Identifier les dépendances ou contraintes techniques` +
              `\n- Préciser les attentes fonctionnelles` +
              `\n\n2. Proposition de réécriture` +
              `\nPropose une version améliorée de l'issue avec :` +
              `\n- Un titre plus clair et descriptif` +
              `\n- Une description structurée (contexte, objectif, critères d'acceptation, notes techniques)` +
              `\n- Les éléments manquants que tu as identifiés` +
              `\n\n**Format attendu :**` +
              `\n\n---` +
              `\n### Questions pour clarifier :` +
              `\n- [Question 1]` +
              `\n- [Question 2]` +
              `\n- [Question 3]` +
              `\n\n### Proposition de réécriture :` +
              `\n**Titre amélioré :** [Nouveau titre]` +
              `\n\n**Description améliorée :**` +
              `\n[Nouvelle description structurée avec sections claires]` +
              `\n\n**Éléments ajoutés pour une meilleure compréhension :**` +
              `\n- [Élément 1]` +
              `\n- [Élément 2]` +
              `\n\n**Raison des modifications :**` +
              `\n[Explication brève de pourquoi ces changements améliorent la clarté]` +
              `\n\n**Règles :**` +
              `\n- Réponds en français.` +
              `\n- Sois concis mais complet.` +
              `\n- Adapte le contenu au contexte technique de l'issue.` +
              `\n- Si la description est vide, propose une structure de base.`;

            const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.MISTRAL_API_KEY}`
              },
              body: JSON.stringify({
                model: 'mistral-small-latest',
                messages: [
                  {
                    role: 'user',
                    content: prompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 1000
              })
            });

            if (!mistralResponse.ok) {
              const error = await mistralResponse.text();
              console.error('Mistral API error:', error);
              const defaultContent = `### Questions pour clarifier :
- Description manquante : Pouvez-vous décrire en détail le problème ou la fonctionnalité souhaitée ?
- Critères d'acceptation : Quels sont les critères pour considérer cette issue comme résolue ?
- Périmètre : Cette issue concerne-t-elle un composant spécifique, une page, ou une fonctionnalité globale ?
- Priorité : Quelle est la priorité de cette issue (ex: haute, moyenne, basse) ?
- Contexte : Y a-t-il un contexte particulier ou des dépendances à prendre en compte ?

### Proposition de réécriture :
**Titre amélioré :** ${title || 'Titre à définir'}

**Description améliorée :**
${description || 'Description à ajouter'}

**Éléments ajoutés pour une meilleure compréhension :**
- Un titre plus descriptif
- Une description détaillée
- Des critères d'acceptation clairs
- Le périmètre et les dépendances

**Raison des modifications :**
L'issue actuelle manque de détails pour une compréhension optimale.`;
              core.setOutput('content', defaultContent);
              return;
            }

            const data = await mistralResponse.json();
            const content = data.choices[0].message.content;
            core.setOutput('content', content);

      - name: Post Mistral-generated content as comment
        uses: actions/github-script@v7
        with:
          script: |
            const content = `${{ steps.mistral.outputs.content }}`;
            
            const commentBody = `Clarification nécessaire pour cette question

Merci d'avoir ouvert cette issue ! Voici une analyse et des suggestions générées par Mistral AI pour améliorer la clarté :

${content}

---
Ce commentaire a été ajouté automatiquement car le label 'question' a été appliqué. Les questions et suggestions ont été générées par Mistral Small.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-clarification']
              });
            } catch (error) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-clarification',
                  color: 'fbc900',
                  description: 'Cette issue a besoin de clarifications'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['needs-clarification']
                });
              } catch (e) {
                console.log('Could not create or add label:', e.message);
              }
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'question'
              });
            } catch (e) {
              console.log('Could not remove question label:', e.message);
            }
