name: Handle Clarification OK Label

on:
  issues:
    types: [labeled]

jobs:
  update_issue_from_comment:
    if: github.event.label.name == 'clarification-ok'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and process latest comment with rewrite proposal
        id: process_comment
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            console.log('Processing issue:', context.issue.number);
            console.log('Number of comments:', comments.length);

            // Trouver le dernier commentaire contenant "Proposition de réécriture"
            const rewriteComments = comments.filter(c =>
              c.body && c.body.includes('Proposition de réécriture')
            );

            let newTitle = '';
            let newDescription = '';

            if (rewriteComments.length > 0) {
              console.log('Found rewrite comments:', rewriteComments.length);
              // Prendre le plus récent
              const latestComment = rewriteComments.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              )[0];

              // Extraire le titre et la description au format standardisé avec ---
              // Format attendu:
              // **Titre amélioré :** [Titre]
              // **Description améliorée :**
              // ---
              // [Description]
              // ---
              const titleMatch = latestComment.body.match(/\*\*Titre amélioré\*\*\s*:\s*\n([^\n*]+)/i);
              if (titleMatch) {
                newTitle = titleMatch[1].trim();
                console.log('Extracted title:', newTitle);
              } else {
                // Fallback : essayer sans le saut de ligne strict
                const titleMatchFallback = latestComment.body.match(/\*\*Titre amélioré\*\*\s*:\s*\n?\s*([^\n*]+)/i);
                if (titleMatchFallback) {
                  newTitle = titleMatchFallback[1].trim();
                  console.log('Extracted title (fallback):', newTitle);
                }
              }

              // Match la description entre --- (avec sauts de ligne flexibles)
              const descMatch = latestComment.body.match(/\*\*Description améliorée\*\*\s*:[^\n]*\n\s*---\s*\n([\s\S]+?)---\s*$/i);
              if (descMatch) {
                newDescription = descMatch[1].trim();
                console.log('Extracted description length:', newDescription.length);
              } else {
                // Essayer sans le $ (fin de chaîne) au cas où il y a des espaces après ---
                const descMatchFallback = latestComment.body.match(/\*\*Description améliorée\*\*\s*:[^\n]*\n\s*---\s*\n([\s\S]+?)---\s*/i);
                if (descMatchFallback) {
                  newDescription = descMatchFallback[1].trim();
                  console.log('Extracted description (fallback) length:', newDescription.length);
                }
              }
            }

            // Si pas de contenu trouvé, générer avec Mistral (uniquement si la clé API est disponible)
            if ((!newTitle || !newDescription) && process.env.MISTRAL_API_KEY) {
              console.log('No valid rewrite proposal found in comments, generating with Mistral...');
              
              const title = issue.title || '';
              const description = issue.body || '';

              // Prompt pour générer une proposition au format standardisé avec ---
              const prompt = "Tu es un assistant technique. Analyse cette issue et propose une réécriture au format suivant :\n\n" +
                "**Issue actuelle :**\n" +
                "- Titre: " + title + "\n" +
                "- Description: " + description + "\n\n" +
                "**Format attendu (en français) :**\n" +
                "### Proposition de réécriture :\n" +
                "**Titre amélioré :** [nouveau titre clair et concis]\n\n" +
                "**Description améliorée :**\n" +
                "---\n" +
                "[Description structurée avec :\n" +
                "- Contexte\n" +
                "- Objectif\n" +
                "- Critères d'acceptation\n" +
                "- Notes techniques (si applicable)]\n" +
                "---\n\n" +
                "**Règles :**\n" +
                "- Sois concis et technique\n" +
                "- Utilise des sections claires (### ou **)\n" +
                "- Conserve les informations importantes de l'original\n" +
                "- Réponds UNIQUEMENT avec le bloc ci-dessus, sans autre texte.";

              try {
                const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
                  },
                  body: JSON.stringify({
                    model: 'mistral-small-latest',
                    messages: [
                      {
                        role: 'user',
                        content: prompt
                      }
                    ],
                    temperature: 0.3,
                    max_tokens: 1000
                  })
                });

                if (mistralResponse.ok) {
                  const data = await mistralResponse.json();
                  const content = data.choices[0].message.content;
                  console.log('Mistral response received');
                  
                  // Extraire le titre et la description au format standardisé
                  const titleMatch = content.match(/\*\*Titre amélioré\*\*\s*:\s*\n([^\n]+)/i);
                  if (titleMatch) {
                    newTitle = titleMatch[1].trim().replace(/^\*\*|\*\*$/g, '').trim();
                    console.log('Mistral title:', newTitle);
                  }
                  
                  const descMatch = content.match(/\*\*Description améliorée\*\*\s*:[^\n]*\n\s*---\s*\n([\s\S]+?)---\s*$/i);
                  if (descMatch) {
                    newDescription = descMatch[1].trim();
                    console.log('Mistral description length:', newDescription.length);
                  }
                } else {
                  console.error('Mistral API error:', mistralResponse.status);
                }
              } catch (error) {
                console.error('Mistral API error:', error);
              }
            } else if (!process.env.MISTRAL_API_KEY) {
              console.log('Mistral API key not configured, skipping generation');
            }

            // Nettoyer et sauvegarder pour l'étape suivante
            if (newTitle) {
              const cleanTitle = newTitle.replace(/\n/g, ' ').replace(/\r/g, ' ').trim();
              core.setOutput('new_title', cleanTitle);
            }
            if (newDescription) {
              const cleanDesc = newDescription.replace(/\n/g, ' ').replace(/\r/g, ' ').trim();
              core.setOutput('new_description', cleanDesc);
            }
            console.log('Outputs set - title:', newTitle, 'description length:', newDescription ? newDescription.length : 0);

      - name: Update issue with extracted content
        if: steps.process_comment.outputs.new_title != '' || steps.process_comment.outputs.new_description != ''
        uses: actions/github-script@v7
        with:
          script: |
            const newTitle = '${{ steps.process_comment.outputs.new_title }}'.trim();
            const newDescription = '${{ steps.process_comment.outputs.new_description }}'.trim();

            console.log('Updating issue with title:', newTitle, 'description length:', newDescription.length);

            const updatePayload = {};
            if (newTitle && newTitle !== '**') {
              updatePayload.title = newTitle;
            }
            if (newDescription && newDescription !== '**') {
              updatePayload.body = newDescription;
            }

            if (Object.keys(updatePayload).length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                ...updatePayload
              });

              // Ajouter un commentaire de confirmation
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Issue mise à jour avec la proposition de réécriture. Merci !'
              });
            } else {
              console.log('No valid updates to apply');
            }

            // Supprimer le label clarification-ok
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'clarification-ok'
              });
              console.log('Removed clarification-ok label');
            } catch (e) {
              console.log('Could not remove clarification-ok label:', e.message);
            }

            // Ajouter le label development
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['development']
              });
              console.log('Added development label');
            } catch (e) {
              // Si le label n'existe pas, le créer
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'development',
                  color: '0075ca',
                  description: 'Issue prête pour le développement'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['development']
                });
                console.log('Created and added development label');
              } catch (e2) {
                console.log('Could not create or add development label:', e2.message);
              }
            }
