name: Handle Clarification OK Label

on:
  issues:
    types: [labeled]

jobs:
  update_issue_from_comment:
    if: github.event.label.name == 'clarification-ok'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and process latest comment with rewrite proposal
        id: process_comment
        uses: actions/github-script@v7
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            console.log('Processing issue:', context.issue.number);
            console.log('Number of comments:', comments.length);

            // Trouver le dernier commentaire contenant "Proposition de réécriture" (avec ou sans ###)
            const rewriteComments = comments.filter(c =>
              c.body && c.body.includes('Proposition de réécriture')
            );
            console.log('Rewrite comments found:', rewriteComments.length);
            if (rewriteComments.length > 0) {
              console.log('Latest comment body preview:', rewriteComments[0].body.substring(0, 200));
            }

            let newTitle = '';
            let newDescription = '';

            if (rewriteComments.length > 0) {
              console.log('Found rewrite comments:', rewriteComments.length);
              // Prendre le plus récent
              const latestComment = rewriteComments.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              )[0];

              // Extraire le titre et la description au format standardisé avec ---
              // Format attendu:
              // **Titre amélioré :** [Titre]
              // **Description améliorée :**
              // ---
              // [Description]
              // ---
              // Extraire le titre (trouver le label et prendre le texte après :)
              const titleLabelIndex = latestComment.body.indexOf('**Titre amélioré :**');
              if (titleLabelIndex !== -1) {
                const afterTitleLabel = latestComment.body.slice(titleLabelIndex + '**Titre amélioré :**'.length).trim();
                const titleEndIndex = afterTitleLabel.indexOf('\n');
                if (titleEndIndex !== -1) {
                  newTitle = afterTitleLabel.slice(0, titleEndIndex).trim().replace(/^\*|\*$/g, '').trim();
                  console.log('Extracted title:', newTitle);
                }
              } else {
                console.log('Title label not found.');
              }

              // Extraire la description entre ---
              const descLabelIndex = latestComment.body.indexOf('**Description améliorée :**');
              if (descLabelIndex !== -1) {
                const afterDescLabel = latestComment.body.slice(descLabelIndex + '**Description améliorée :**'.length).trim();
                const descStartIndex = afterDescLabel.indexOf('---\n');
                if (descStartIndex !== -1) {
                  const afterFirstDash = afterDescLabel.slice(descStartIndex + '---\n'.length);
                  const descEndIndex = afterFirstDash.indexOf('\n---');
                  if (descEndIndex !== -1) {
                    newDescription = afterFirstDash.slice(0, descEndIndex).trim();
                    console.log('Extracted description length:', newDescription.length);
                  }
                }
              } else {
                console.log('Description label not found.');
              }
            }

            // Si pas de contenu trouvé, générer avec Mistral (uniquement si la clé API est disponible)
            // DESACTIVE POUR TEST : if ((!newTitle || !newDescription) && process.env.MISTRAL_API_KEY) {
            if (false && (!newTitle || !newDescription) && process.env.MISTRAL_API_KEY) {
              console.log('No valid rewrite proposal found in comments, generating with Mistral...');
              
              const title = issue.title || '';
              const description = issue.body || '';

              // Prompt pour générer une proposition au format standardisé avec ---
              const prompt = "Tu es un assistant technique. Analyse cette issue et propose une réécriture au format suivant :\n\n" +
                "**Issue actuelle :**\n" +
                "- Titre: " + title + "\n" +
                "- Description: " + description + "\n\n" +
                "**Format attendu (en français) :**\n" +
                "### Proposition de réécriture :\n" +
                "**Titre amélioré :** [nouveau titre clair et concis]\n\n" +
                "**Description améliorée :**\n" +
                "---\n" +
                "[Description structurée avec :\n" +
                "- Contexte\n" +
                "- Objectif\n" +
                "- Critères d'acceptation\n" +
                "- Notes techniques (si applicable)]\n" +
                "---\n\n" +
                "**Règles :**\n" +
                "- Sois concis et technique\n" +
                "- Utilise des sections claires (### ou **)\n" +
                "- Conserve les informations importantes de l'original\n" +
                "- Réponds UNIQUEMENT avec le bloc ci-dessus, sans autre texte.";

              try {
                const mistralResponse = await fetch('https://api.mistral.ai/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + process.env.MISTRAL_API_KEY
                  },
                  body: JSON.stringify({
                    model: 'mistral-small-latest',
                    messages: [
                      {
                        role: 'user',
                        content: prompt
                      }
                    ],
                    temperature: 0.3,
                    max_tokens: 1000
                  })
                });

                if (mistralResponse.ok) {
                  const data = await mistralResponse.json();
                  const content = data.choices[0].message.content;
                  console.log('Mistral response received');
                  
                  // Extraire le titre et la description au format standardisé (même logique que pour les commentaires)
                  const titleLabelIndex = content.indexOf('**Titre amélioré :**');
                  if (titleLabelIndex !== -1) {
                    const afterTitleLabel = content.slice(titleLabelIndex + '**Titre amélioré :**'.length).trim();
                    const titleEndIndex = afterTitleLabel.indexOf('\n');
                    if (titleEndIndex !== -1) {
                      newTitle = afterTitleLabel.slice(0, titleEndIndex).trim().replace(/^\*|\*$/g, '').trim();
                      console.log('Mistral title:', newTitle);
                    }
                  }
                  
                  const descLabelIndex = content.indexOf('**Description améliorée :**');
                  if (descLabelIndex !== -1) {
                    const afterDescLabel = content.slice(descLabelIndex + '**Description améliorée :**'.length).trim();
                    const descStartIndex = afterDescLabel.indexOf('---\n');
                    if (descStartIndex !== -1) {
                      const afterFirstDash = afterDescLabel.slice(descStartIndex + '---\n'.length);
                      const descEndIndex = afterFirstDash.indexOf('\n---');
                      if (descEndIndex !== -1) {
                        newDescription = afterFirstDash.slice(0, descEndIndex).trim();
                        console.log('Mistral description length:', newDescription.length);
                      }
                    }
                  }
                } else {
                  console.error('Mistral API error:', mistralResponse.status);
                }
              } catch (error) {
                console.error('Mistral API error:', error);
              }
            } else if (!process.env.MISTRAL_API_KEY) {
              console.log('Mistral API key not configured, skipping generation');
            }

            // Nettoyer et sauvegarder pour l'étape suivante (conserver les sauts de ligne)
            // Utiliser base64 pour éviter les problèmes d'échappement
            if (newTitle) {
              const cleanTitle = newTitle.replace(/\r/g, '').trim();
              core.setOutput('new_title', Buffer.from(cleanTitle).toString('base64'));
            }
            if (newDescription) {
              // Conserver les sauts de ligne pour le formatage
              const cleanDesc = newDescription.replace(/\r/g, '');
              core.setOutput('new_description', Buffer.from(cleanDesc).toString('base64'));
            }
            console.log('Outputs set - title:', newTitle, 'description length:', newDescription ? newDescription.length : 0);

      - name: Update issue with extracted content
        if: steps.process_comment.outputs.new_title != '' || steps.process_comment.outputs.new_description != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Décoder les valeurs base64
            const newTitle = '${{ steps.process_comment.outputs.new_title }}' ? Buffer.from('${{ steps.process_comment.outputs.new_title }}', 'base64').toString('utf8').trim() : '';
            const newDescription = '${{ steps.process_comment.outputs.new_description }}' ? Buffer.from('${{ steps.process_comment.outputs.new_description }}', 'base64').toString('utf8') : '';

            console.log('Updating issue with title:', newTitle, 'description length:', newDescription.length);

            const updatePayload = {};
            if (newTitle && newTitle !== '**') {
              updatePayload.title = newTitle;
            }
            if (newDescription && newDescription !== '**') {
              updatePayload.body = newDescription;
            }

            if (Object.keys(updatePayload).length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                ...updatePayload
              });

              // Ajouter un commentaire de confirmation
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Issue mise à jour avec la proposition de réécriture. Merci !'
              });
            } else {
              console.log('No valid updates to apply');
            }

            // Supprimer le label clarification-ok
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'clarification-ok'
              });
              console.log('Removed clarification-ok label');
            } catch (e) {
              console.log('Could not remove clarification-ok label:', e.message);
            }

            // Ajouter le label development
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['development']
              });
              console.log('Added development label');
            } catch (e) {
              // Si le label n'existe pas, le créer
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'development',
                  color: '0075ca',
                  description: 'Issue prête pour le développement'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['development']
                });
                console.log('Created and added development label');
              } catch (e2) {
                console.log('Could not create or add development label:', e2.message);
              }
            }
