<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice de pourcentage</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <h1>Calculatrice de pourcentage</h1>
    <div class="calculator">
        <label for="number">Nombre :</label>
        <input type="number" id="number" placeholder="Votre nombre">

        <label for="percent">Pourcentage (%):</label>
        <input type="number" id="percent" placeholder="Votre pourcentage">

        <button id="calculate">Calculer</button>

        <div id="result"></div>
    </div>
    <script src="../scripts/percentage.js"></script>
</body>
</html>
